<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multi Close</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1 class="title">Multi Close</h1>
      <p id="domain" class="domain">Select a tab to begin.</p>
      <button id="close" class="action" disabled>Close all tabs from &lt;domain&gt;</button>
      <p id="hint" class="hint">Best effort on mobile tab menus.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
